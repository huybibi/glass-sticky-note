name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icons
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: sticky-glass-windows
          path: dist/*.exe

  mac:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icons
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: sticky-glass-macos
          path: dist/*.dmg
